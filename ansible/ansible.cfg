[defaults]
inventory = inventory/terraform.py
local_tmp = ../.local/ansible/tmp
remote_tmp = /tmp/.ansible-${USER}/tmp
host_key_checking = True
interpreter_python = /usr/bin/python3
retry_files_enabled = False
forks = 3

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=../.local/known_hosts
control_path_dir = ../.local/ansible/cp

[inventory]
unparsed_is_failed = True
