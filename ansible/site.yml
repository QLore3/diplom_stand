---
- name: Prepare Kubernetes nodes
  hosts: k8s_cluster
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for freshly created nodes
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Wait for initial cloud configuration
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc not in [0, 2]
      async: 600
      poll: 10

    - name: Gather node facts after cloud initialization
      ansible.builtin.setup:
  tasks:
    - name: Configure OS and container runtime
      ansible.builtin.import_tasks: tasks/prepare.yml
  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted

- name: Initialize control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Bootstrap control plane
      ansible.builtin.import_tasks: tasks/control-plane.yml

- name: Join worker nodes
  hosts: workers
  become: true
  tasks:
    - name: Join cluster
      ansible.builtin.import_tasks: tasks/workers.yml

- name: Configure pod networking and verify cluster
  hosts: control_plane
  become: true
  tasks:
    - name: Install CNI and wait for readiness
      ansible.builtin.import_tasks: tasks/network.yml
