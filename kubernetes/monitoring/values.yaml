# Учебный стенд: одна реплика и временное хранение метрик.
fullnameOverride: monitoring
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  podLabels:
    diplom-heavy-monitoring: 'true'
  affinity: &id001
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            diplom-heavy-monitoring: 'true'
        topologyKey: kubernetes.io/hostname
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi
    dashboards:
      searchNamespace: monitoring
    datasources:
      searchNamespace: monitoring
  grafana.ini:
    server:
      serve_from_sub_path: true
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  deploymentStrategy:
    type: Recreate
  serviceMonitor:
    path: /grafana/metrics
prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 192Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 48Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 6h
    retentionSize: 512MB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    storageSpec:
      emptyDir:
        sizeLimit: 1Gi
    podMetadata:
      labels:
        diplom-heavy-monitoring: 'true'
    affinity: *id001
    podAntiAffinity: ''
alertmanager:
  alertmanagerSpec:
    replicas: 1
    retention: 6h
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      emptyDir:
        sizeLimit: 64Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi
