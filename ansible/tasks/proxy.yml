---
- name: Install public nginx reverse proxy
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180

- name: Read application ClusterIP
  ansible.builtin.command: "kubectl --kubeconfig=/etc/kubernetes/admin.conf -n {{ app_namespace }} get service diplom-app -o jsonpath={.spec.clusterIP}"
  register: app_cluster_ip
  changed_when: false

- name: Read Grafana ClusterIP
  ansible.builtin.command: "kubectl --kubeconfig=/etc/kubernetes/admin.conf -n {{ monitoring_namespace }} get service {{ monitoring_release }}-grafana -o jsonpath={.spec.clusterIP}"
  register: grafana_cluster_ip
  changed_when: false

- name: Configure public reverse proxy
  ansible.builtin.template:
    src: public-nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
    validate: /usr/sbin/nginx -t -c %s
  notify: Reload public nginx

- name: Enable public nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
